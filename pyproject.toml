[project]
name = "syntheca"
version = "0.1.0"
description = "ETL pipeline for institutional academic metadata"
readme = "README.md"
authors = [
    { name = "Samuel Mok", email = "s.mok@utwente.nl" }
]
requires-python = ">=3.14"
dependencies = [
    "dacite>=1.9.2",
    "httpx>=0.28.1",
    "levenshtein>=0.27.3",
    "loguru>=0.7.3",
    "marimo>=0.17.8",
    "openpyxl>=3.1.5",
    "tqdm>=4.65.0",
    "polars>=1.35.2",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "selectolax>=0.4.3",
    "tenacity>=9.1.2",
    "xlsxwriter>=3.2.9",
    "xmltodict>=1.0.2",
    "rich>=14.2.0",
    "lxml>=6.0.2",
]

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.5",
    "ty>=0.0.1a27",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["current_marimo_monolith.py", "archive/", "syntheca/"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "RUF",
    "D",
]
ignore=["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D107"]
"scripts/**" = ["D100", "D103"]

[tool.ruff.lint.isort]
known-first-party = ["syntheca"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not live and not network and not slow'"
markers = [
    "live: tests that hit real external services (deselected by default)",
    "network: tests that require network access (deselected by default)",
    "slow: tests that are too slow for routine runs (deselected by default)",
]
